<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>견적 요청함</title>
  <style>
    :root { --paper:#f1f2ee; --ink:#1d2a36; --graphite:#56616b; --rule:#c5cac3; --seal:#a8322d; --white:#fbfbf9; }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.6 "Malgun Gothic", system-ui, sans-serif; word-break: keep-all; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 22px; margin: 0 0 20px; }
    :focus-visible { outline: 3px solid var(--seal); outline-offset: 2px; }
    button { font: inherit; cursor: pointer; }
    .login { display: grid; gap: 12px; max-width: 360px; margin-top: 12vh; }
    .login input { font: inherit; padding: 14px; border: 1px solid #9aa29c; border-radius: 2px; background: var(--white); }
    .primary { background: var(--ink); color: var(--white); border: 0; padding: 14px; border-radius: 2px; font-weight: 600; }
    .err { color: var(--seal); min-height: 1.5em; margin: 0; }
    .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .ghost { background: none; border: 1px solid var(--rule); padding: 8px 12px; border-radius: 2px; color: var(--graphite); }
    .count { border: 2px solid var(--ink); background: var(--white); padding: 18px 20px; margin: 8px 0 24px; display: flex; align-items: baseline; gap: 12px; }
    .count b { font-size: 44px; line-height: 1; }
    .list { display: grid; gap: 12px; }
    .card { background: var(--white); border: 1px solid var(--rule); padding: 16px; }
    .card.new { border-left: 4px solid var(--seal); }
    .meta { color: var(--graphite); font-size: 14px; }
    .name { font-weight: 600; font-size: 18px; margin: 4px 0; }
    .contact { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; font-size: 17px; }
    .doc { margin: 8px 0 12px; }
    .status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .status button { padding: 12px 4px; border: 1px solid var(--ink); background: var(--white); color: var(--ink); border-radius: 2px; min-height: 44px; }
    .status button[aria-pressed="true"] { background: var(--ink); color: var(--white); font-weight: 600; }
    .empty { color: var(--graphite); padding: 32px 0; }
  </style>
</head>
<body>
<main>
  <form id="login" class="login">
    <h1>견적 요청함</h1>
    <label for="pw">관리자 비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">들어가기</button>
    <p class="err" id="login-err" role="alert"></p>
  </form>

  <section id="app" hidden>
    <div class="head">
      <h1>견적 요청함</h1>
      <button class="ghost" id="logout" type="button">나가기</button>
    </div>
    <div class="count"><b id="new-count">0</b><span>새 견적 요청</span></div>
    <p class="err" id="app-err" role="alert"></p>
    <div class="list" id="list"></div>
  </section>
</main>
<script>
(() => {
  const KEY = 'admin-pw';
  const STATUSES = ['새 문의', '연락함', '완료'];
  const $ = (id) => document.getElementById(id);
  const getPw = () => { try { return sessionStorage.getItem(KEY) || ''; } catch { return ''; } };
  const setPw = (v) => { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch {} };

  const api = (method, body) => fetch('/api/admin', {
    method,
    headers: { 'x-admin-password': getPw(), ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });

  const showLogin = (msg) => {
    setPw('');
    $('app').hidden = true; $('login').hidden = false;
    $('login-err').textContent = msg || '';
    $('pw').value = ''; $('pw').focus();
  };

  const fmt = (s) => new Date(s).toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  const render = (rows) => {
    $('new-count').textContent = rows.filter((r) => r.status === '새 문의').length;
    const list = $('list');
    list.textContent = '';
    if (!rows.length) { list.innerHTML = '<p class="empty">아직 견적 요청이 없어요.</p>'; return; }
    for (const r of rows) {
      const card = document.createElement('article');
      card.className = 'card' + (r.status === '새 문의' ? ' new' : '');
      const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = fmt(r.created_at);
      const name = document.createElement('div'); name.className = 'name'; name.textContent = r.name;
      const c = document.createElement('button'); c.type = 'button'; c.className = 'contact'; c.textContent = r.contact;
      c.title = '눌러서 복사';
      c.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(r.contact); c.textContent = r.contact + ' (복사됨)'; setTimeout(() => (c.textContent = r.contact), 1500); }
        catch { const range = document.createRange(); range.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(range); }
      });
      const doc = document.createElement('div'); doc.className = 'doc'; doc.textContent = '필요한 서류: ' + (r.message || '-');
      const st = document.createElement('div'); st.className = 'status';
      for (const s of STATUSES) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = s;
        b.setAttribute('aria-pressed', String(r.status === s));
        b.addEventListener('click', () => setStatus(r.id, s));
        st.append(b);
      }
      card.append(meta, name, c, doc, st);
      list.append(card);
    }
  };

  const load = async () => {
    $('app-err').textContent = '';
    const r = await api('GET');
    if (r.status === 401) return showLogin('비밀번호가 맞지 않아요.');
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      if ($('app').hidden) return showLogin(j.error || '불러오지 못했어요.');
      $('app-err').textContent = j.error || '불러오지 못했어요.'; return;
    }
    $('login').hidden = true; $('app').hidden = false;
    render(j.rows || []);
  };

  const setStatus = async (id, status) => {
    const r = await api('PATCH', { id, status });
    if (r.status === 401) return showLogin('비밀번호가 맞지 않아요.');
    if (!r.ok) { const j = await r.json().catch(() => ({})); $('app-err').textContent = j.error || '바꾸지 못했어요.'; return; }
    load();
  };

  $('login').addEventListener('submit', (e) => { e.preventDefault(); setPw($('pw').value); load(); });
  $('logout').addEventListener('click', () => showLogin(''));
  if (getPw()) load(); else $('pw').focus();
})();
</script>
</body>
</html>
